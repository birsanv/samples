# Greenfield passive hub: OLM operators only (no MulticlusterGlobalHub, no PostgresCluster, no Kafka).
# Playbook: global-hub-postgres-pgbackrest-s3.md §7
#
# Apply before pgBackRest restore from S3, then ACM Velero restore for MGH and hub CRs.
apiVersion: v1
kind: Namespace
metadata:
  name: multicluster-global-hub
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: multicluster-global-hub
  namespace: multicluster-global-hub
spec:
  targetNamespaces:
    - multicluster-global-hub
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: multicluster-global-hub-operator
  namespace: multicluster-global-hub
spec:
  channel: release-1.8
  installPlanApproval: Automatic
  name: multicluster-global-hub-operator-rh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: crunchy-postgres-operator
  namespace: multicluster-global-hub
spec:
  channel: v5
  installPlanApproval: Automatic
  name: crunchy-postgres-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
