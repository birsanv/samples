# Bootstrap PostgresCluster `postgres` from pgBackRest on S3 (repo2), then ACM Velero restore for MGH.
#
# Playbook: global-hub-postgres-pgbackrest-s3.md §7
#
# BEFORE apply on passive hub:
#   1. Operators only: global-hub-operators-only.yaml (GH + Crunchy CSVs Succeeded).
#   2. No MulticlusterGlobalHub yet (comes from ACM Restore §7.3 after this step).
#   3. S3 Secret — Path A: global-hub-postgres-pgbackrest-s3-secret.sh
#                     Path B: passive credentials restore (playbook §2.1 + §7.1.1)
#   4. Stop pgBackRest on the OLD hub (no concurrent writes to source repo2-path).
#
# dataSource.global.repo2-path = SOURCE hub backup prefix.
# spec.backups.global.repo2-path = NEW prefix on this hub after cutover (default repo2-hub-b).
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres
  namespace: multicluster-global-hub
spec:
  postgresVersion: 16
  dataSource:
    pgbackrest:
      stanza: db
      configuration:
        - secret:
            name: multicluster-global-hub-pgbackrest-s3
      global:
        repo2-path: /pgbackrest/multicluster-global-hub/postgres/repo2
      repo:
        name: repo2
        s3:
          bucket: YOUR_S3_BUCKET
          endpoint: s3.us-east-2.amazonaws.com
          region: us-east-2
  users:
    - name: postgres
      databases:
        - hoh
    - name: guest
      databases:
        - hoh
      options: LOGIN
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          max_wal_size: 3GB
          wal_recycle: true
          wal_init_zero: false
  instances:
    - name: pgha1
      replicas: 3
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 25Gi
  backups:
    pgbackrest:
      configuration:
        - secret:
            name: multicluster-global-hub-pgbackrest-s3
      global:
        repo2-path: /pgbackrest/multicluster-global-hub/postgres/repo2-hub-b
      repos:
        - name: repo2
          schedules:
            full: "0 2 * * 0"
            incremental: "0 * * * *"
            differential: "0 3 * * 1-6"
          s3:
            bucket: YOUR_S3_BUCKET
            endpoint: s3.us-east-2.amazonaws.com
            region: us-east-2
